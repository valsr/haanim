<!DOCTYPE html>
<html>

    <head>
        <meta charset="utf-8">
        <title>HAAnim</title>
        <link rel="stylesheet" href="panel.css">
    </head>

    <body>
        <div class="header">
            <div class="button-section">
                <button class="action-button reload-button" onclick="reloadScripts()">↻ Reload</button>
                <button class="action-button add-button" onclick="openScriptFolder()">📁 Open Folder</button>
            </div>
        </div>

        <div class="content">
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <div>Loading scripts...</div>
            </div>

            <div id="empty-state" class="empty-state" style="display: none;">
                <div class="empty-state-icon">📝</div>
                <div class="empty-state-text">No animation scripts yet</div>
                <div class="empty-state-subtext">
                    Add Python scripts to your <code id="script-folder-path">haanim/</code> folder to get started.
                    <br>Scripts are automatically loaded and watched for changes.
                </div>
            </div>

            <div id="scripts-container" class="scripts-container" style="display: none;">
                <!-- Scripts will be rendered here -->
            </div>

            <div id="error-state" class="error-state" style="display: none;">
                <div class="error-icon">⚠️</div>
                <div class="error-text">Failed to load scripts</div>
                <div class="error-subtext" id="error-message"></div>
                <button class="action-button" onclick="loadScripts()">Retry</button>
            </div>
        </div>

        <script src="panel.js"></script>
    </body>

</html>
