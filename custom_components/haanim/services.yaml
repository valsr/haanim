# Services of the HAAnim integration. See "Home Assistant Services" in the design.

run_action:
  fields:
    automation_id:
      required: true
      example: 'my_automation'
      selector:
        text:
    action:
      required: true
      example: 'my_action'
      selector:
        text:
    data:
      required: false
      example: '{"room": "hall"}'
      selector:
        object:

enable:
  fields:
    automation_id:
      required: true
      example: 'my_automation'
      selector:
        text:

disable:
  fields:
    automation_id:
      required: true
      example: 'my_automation'
      selector:
        text:

start:
  fields:
    automation_id:
      required: true
      example: 'my_automation'
      selector:
        text:

stop:
  fields:
    automation_id:
      required: true
      example: 'my_automation'
      selector:
        text:

restart:
  fields:
    automation_id:
      required: true
      example: 'my_automation'
      selector:
        text:

reload:
  fields:
    automation_id:
      required: false
      example: 'my_automation'
      selector:
        text:

list_automations:

list_actions:
  fields:
    automation_id:
      required: true
      example: 'my_automation'
      selector:
        text:

clear_log:
  fields:
    automation_id:
      required: false
      example: 'my_automation'
      selector:
        text:

set_log_level:
  fields:
    automation_id:
      required: true
      example: 'my_automation'
      selector:
        text:
    level:
      required: true
      example: 'debug'
      selector:
        select:
          options:
            - 'debug'
            - 'info'
            - 'warning'
            - 'error'
            - 'critical'
            - 'default'
