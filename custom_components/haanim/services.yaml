# Services for HAAnim integration

run_action:
  name: Run Action
  description: Run a specific action from a HAAnim automation.
  fields:
    automation_id:
      name: Automation Name
      description: The name of the automation containing the action.
      required: true
      example: 'my_automation'
      selector:
        text:
    action_name:
      name: Action Name
      description: The name of the action to run.
      required: true
      example: 'my_action'
      selector:
        text:

reload_automations:
  name: Reload Automations
  description: Reload all HAAnim automations from the automation directory.

list_automations:
  name: List Automations
  description: Get a list of all loaded HAAnim automations and their metadata.

list_actions:
  name: List Actions
  description: Get a list of all available actions, optionally filtered by automation.
  fields:
    automation_id:
      name: Automation Name
      description: Optional automation name to filter actions.
      required: false
      example: 'my_automation'
      selector:
        text:

get_config:
  name: Get Configuration
  description: Get the current HAAnim configuration values.
