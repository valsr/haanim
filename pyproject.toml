[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "haanim"
dynamic = ["version"]
description = "Python automations for Home Assistant: the HAAnim engine and its test harness"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "valsr" }]
keywords = ["home-assistant", "homeassistant", "automation", "hacs"]
requires-python = ">=3.14.2"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Home Automation",
    "Typing :: Typed",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
# The engine and the harness do not need Home Assistant; the integration in custom_components does.
dependencies = [
    "cronsim>=2.6",
    "python-slugify>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "homeassistant>=2026.9.0,<2026.10",
    "pyright>=1.1.380",
    "black>=24.0.0",
    "pylint>=3.0.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "pytest>=8.0.0",
    "pytest-homeassistant-custom-component>=0.13.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
]

[tool.hatch.version]
path = "src/haanim/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/haanim"]

[tool.hatch.build.targets.sdist]
include = ["/src/haanim", "/README.md", "/LICENSE"]

[project.urls]
Homepage = "https://github.com/valsr/haanim"
Documentation = "https://haanim.readthedocs.io/"
Repository = "https://github.com/valsr/haanim"
Issues = "https://github.com/valsr/haanim/issues"
Changelog = "https://github.com/valsr/haanim/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "homeassistant>=2026.9.0,<2026.10",
    "pyright>=1.1.380",
    "black>=24.0.0",
    "pylint>=3.0.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "pytest>=8.0.0",
    "pytest-homeassistant-custom-component>=0.13.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
]

[tool.black]
line-length = 110
target-version = ["py314"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.pylint.main]
py-version = "3.14"
ignore = [".venv", "venv", ".pytest_cache"]
source-roots = [".", "src"]
max-line-length = 110

[tool.pylint.messages_control]
disable = [
    "too-few-public-methods",
    "too-many-instance-attributes",
    "too-many-arguments",
    # Protocol methods end in "..." after their docstring: pyright needs it to see a stub, not a
    # function that forgot to return
    "unnecessary-ellipsis",
]


# Per-path configuration for tests
# These warnings are acceptable in test code
[tool.pylint."messages_control:tests/**"]
disable = [
    "protected-access",      # W0212: Tests often access private members
    "redefined-outer-name",  # W0621: Pytest fixtures redefine outer names
    "unused-argument",       # W0613: Fixtures injected but not directly used
]

# Automations in the development container are checked without the container's Home Assistant
[tool.pylint."messages_control:podman/**"]
disable=[
    "import-error",
]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
explicit_package_bases = true
mypy_path = "src"

[tool.pyright]
pythonVersion = "3.14"
extraPaths = ["src"]
exclude = [".venv", "venv", ".pytest_cache", "**/__pycache__", "htmlcov", "out"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-v",
    "--strict-markers",
    # Parallel execution - use 'auto' to detect CPU count, or specify number like '-n4'
    "-n",
    "auto",
    "--dist",
    "loadgroup",
    "--cov=custom_components/haanim",
    "--cov=src/haanim",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    # Never lowered. The design asks for 80; the public automation-facing API is held at 100%
    # by scripts/check-public-api-coverage.py.
    "--cov-fail-under=96",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["custom_components/haanim", "src/haanim"]
omit = [
    "tests/*",
    "*/__pycache__/*",
    "*/conftest.py",
]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@overload",
    "@abc.abstractmethod",
    # The body of a protocol method
    "^\\s*\\.\\.\\.$",
]
fail_under = 95
show_missing = true
skip_covered = false
precision = 0

[tool.coverage.html]
directory = "htmlcov"
title = "HAAnim Coverage Report"
