[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "haanim"
version = "0.1.0"
description = "A Home Assistant custom component for HAAnim integration"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "your.email@example.com" }]
requires-python = ">=3.13.2"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["homeassistant>=2025.11.3"]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "pylint>=3.0.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "pytest>=8.0.0",
    "pytest-homeassistant-custom-component>=0.13.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
]

[project.urls]
Homepage = "https://github.com/valsr/haanim"
Documentation = "https://github.com/valsr/haanim"
Repository = "https://gitlab.com/valsr/haanim"
Issues = "https://github.com/valsr/haanim/issues"

[dependency-groups]
dev = [
    "black>=24.0.0",
    "pylint>=3.0.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "pytest>=8.0.0",
    "pytest-homeassistant-custom-component>=0.13.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
]

[tool.black]
line-length = 110
target-version = ["py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.pylint.main]
py-version = "3.13"
ignore = [".venv", "venv", ".pytest_cache", "stubs"]
max-line-length = 110

[tool.pylint.messages_control]
disable = [
    "too-few-public-methods",
    "too-many-instance-attributes",
    "too-many-arguments",
]


# Per-path configuration for tests
# These warnings are acceptable in test code
[tool.pylint."messages_control:tests/**"]
disable = [
    "protected-access",      # W0212: Tests often access private members
    "redefined-outer-name",  # W0621: Pytest fixtures redefine outer names
    "unused-argument",       # W0613: Fixtures injected but not directly used
]

# Per-path configuration for stubs
[tool.pylint."messages_control:podman/**"]
disable=[
    "import-error",        # E0401: Stubs may reference modules not present at runtime
]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["stubs/"]

[tool.pyright]
pythonVersion = "3.13"
stubPath = "stubs"
extraPaths = ["stubs", "podman/container-config/haanim"]
exclude = [".venv", "venv", ".pytest_cache", "stubs/", "**/__pycache__"]
ignore = ["stubs/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-v",
    "--strict-markers",
    # Parallel execution - use 'auto' to detect CPU count, or specify number like '-n4'
    "-n",
    "auto",
    "--dist",
    "loadgroup",
    "--cov=custom_components/haanim",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    # Target coverage is 80%, set to 0 during initial development
    # TODO: Increase to 80 when sufficient tests are added
    "--cov-fail-under=0",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["custom_components/haanim"]
omit = [
    "tests/*",
    "*/__pycache__/*",
    "*/conftest.py",
]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]
fail_under = 80
show_missing = true
skip_covered = false
precision = 0

[tool.coverage.html]
directory = "htmlcov"
title = "HAAnim Coverage Report"
