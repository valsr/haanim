name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13']

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install UV
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Set up Python ${{ matrix.python-version }}
        run: |
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Set up Node (the suite runs the frontend unit tests)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run tests (fails under the overall coverage gate in pyproject.toml)
        run: uv run pytest --cov=custom_components/haanim --cov=src/haanim --cov-report=term --cov-report=xml --cov-report=html

      - name: Public automation-facing API is covered at 100%
        run: uv run python scripts/check-public-api-coverage.py coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
          retention-days: 30

  frontend:
    name: Frontend unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run frontend tests with coverage gate
        run: scripts/test-frontend.sh

  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install UV
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Set up Python
        run: |
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Check code formatting with Black
        run: uv run black --check --line-length 110 custom_components/haanim/ src/haanim/

      - name: Lint with Pylint
        run: uv run pylint custom_components/haanim/ src/haanim/ || true

      - name: Lint with Flake8
        run: uv run flake8 custom_components/haanim/ src/haanim/ || true

      - name: Type check with mypy
        run: uv run mypy custom_components/haanim/ src/haanim/ || true

      - name: Type check the engine package with pyright
        run: uv run pyright src/haanim || true

  secret-detection:
    name: Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
