name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13']

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install UV
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Set up Python ${{ matrix.python-version }}
        run: |
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest --cov=custom_components/haanim --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install UV
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Set up Python
        run: |
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Check code formatting with Black
        run: uv run black --check --line-length 110 custom_components/haanim/

      - name: Lint with Pylint
        run: uv run pylint custom_components/haanim/ || true

      - name: Lint with Flake8
        run: uv run flake8 custom_components/haanim/ || true

      - name: Type check with mypy
        run: uv run mypy custom_components/haanim/ || true
