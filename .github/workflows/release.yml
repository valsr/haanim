name: Release

# When a release is published on GitHub:
# - build the integration with the engine in it and attach it to the release as haanim.zip. HACS installs
#   that file (see hacs.json), so nothing has to be installed from PyPI;
# - build the haanim package (the engine and the test harness, for an author's own machine) and publish it
#   on PyPI. PyPI trusts this workflow in the "pypi" environment (trusted publishing): there is no token.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  integration:
    name: Build haanim.zip
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: The release is the version the code states
        run: |
          version="$(python -c "import json; print(json.load(open('custom_components/haanim/manifest.json'))['version'])")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "The release is $GITHUB_REF_NAME but manifest.json says $version" >&2
            exit 1
          fi

      - name: Build the integration with the engine in it
        run: python scripts/build-integration.py --output dist/haanim.zip

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/haanim.zip --clobber

  package:
    name: Build the haanim package
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: The release is the version the package states
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/haanim/__init__.py)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "The release is $GITHUB_REF_NAME but the package says $version" >&2
            exit 1
          fi

      - name: Build the wheel and the source archive
        run: uv build

      - name: Check what PyPI will show
        run: uvx twine check --strict dist/*

      - name: Keep the files for the publishing job
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/

  pypi:
    name: Publish on PyPI
    needs: [integration, package]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/haanim/
    permissions:
      id-token: write
    steps:
      - name: Get the built files
        uses: actions/download-artifact@v4
        with:
          name: package
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
