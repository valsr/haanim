name: Release

# When a release is published on GitHub, build the integration with the engine in it and attach it to the
# release as haanim.zip. HACS installs that file (see hacs.json), so nothing has to be installed from PyPI.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  integration:
    name: Build haanim.zip
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: The release is the version the code states
        run: |
          version="$(python -c "import json; print(json.load(open('custom_components/haanim/manifest.json'))['version'])")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "The release is $GITHUB_REF_NAME but manifest.json says $version" >&2
            exit 1
          fi

      - name: Build the integration with the engine in it
        run: python scripts/build-integration.py --output dist/haanim.zip

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/haanim.zip --clobber
