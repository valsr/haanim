version: '3.8'

services:
  homeassistant:
    container_name: haanim-dev-legacy
    image: docker.io/homeassistant/home-assistant:latest
    volumes:
      # Mount the custom component for development
      - ./custom_components/haanim:/config/custom_components/haanim:z
      # Persist Home Assistant data
      - hass-data:/config:z
    ports:
      # Home Assistant web interface
      - '8123:8123'
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=UTC

volumes:
  hass-data:
    driver: local
