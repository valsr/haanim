# GitLab CI/CD Pipeline for HAAnim
# Uses UV for fast Python package management

stages:
  - setup
  - test
  - lint
  - security

variables:
  # UV settings
  UV_VERSION: "0.9.12"
  PYTHON_VERSION: "3.12"
  # Cache settings
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  # Security
  SECRET_DETECTION_ENABLED: "true"

# Cache UV and pip downloads across jobs
cache:
  key: "${CI_COMMIT_REF_SLUG}-${PYTHON_VERSION}"
  paths:
    - .cache/pip
    - .cache/uv
    - .venv/

# Default setup for all jobs
.uv_setup:
  image: python:${PYTHON_VERSION}
  before_script:
    # Install UV
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
    - uv --version
    # Sync dependencies
    - uv sync --all-extras
  artifacts:
    when: always
    expire_in: 1 week

# ================================
# Test Stage
# ================================

test:python3.13:
  extends: .uv_setup
  stage: test
  image: python:3.13
  script:
    - uv run pytest --cov=custom_components/haanim --cov-report=term --cov-report=xml --cov-report=html
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - htmlcov/
      - coverage.xml
    expire_in: 30 days

test:python3.12:
  extends: .uv_setup
  stage: test
  image: python:3.12
  script:
    - uv run pytest --cov=custom_components/haanim --cov-report=term --cov-report=xml --cov-report=html
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - htmlcov/
      - coverage.xml
    expire_in: 30 days

# ================================
# Lint Stage
# ================================

lint:black:
  extends: .uv_setup
  stage: lint
  script:
    - echo "Checking code formatting with Black..."
    - uv run black --check --line-length 110 custom_components/haanim/
  allow_failure: false

lint:pylint:
  extends: .uv_setup
  stage: lint
  script:
    - echo "Linting with Pylint..."
    - uv run pylint custom_components/haanim/ --exit-zero
  allow_failure: true

lint:flake8:
  extends: .uv_setup
  stage: lint
  script:
    - echo "Linting with Flake8..."
    - uv run flake8 custom_components/haanim/ --exit-zero
  allow_failure: true

lint:mypy:
  extends: .uv_setup
  stage: lint
  script:
    - echo "Type checking with mypy..."
    - uv run mypy custom_components/haanim/ --no-error-summary || true
  allow_failure: true

# Combined check job (runs all checks)
lint:all:
  extends: .uv_setup
  stage: lint
  script:
    - echo "Running all code quality checks..."
    - uv run black --check --line-length 110 custom_components/haanim/ || echo "Black check failed"
    - uv run pylint custom_components/haanim/ || echo "Pylint check completed"
    - uv run flake8 custom_components/haanim/ || echo "Flake8 check completed"
    - uv run mypy custom_components/haanim/ || echo "Mypy check completed"
  allow_failure: true
  when: manual

# ================================
# Security Stage
# ================================

secret_detection:
  stage: security

# Include GitLab security templates
include:
  - template: Security/Secret-Detection.gitlab-ci.yml
